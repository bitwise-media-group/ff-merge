# Caller for the reusable CI workflow. It owns the push/pull_request triggers; the work
# runs in github-workflows/ci.yaml, which runs the canonical mise tasks (lint / build /
# test) as one job each, with every tool -- bun included -- from the toolchain
# submodule's pins. `build` regenerates dist/ and the reusable workflow fails the run if
# the committed bundle doesn't reproduce from src/.
#
# Pinned to a full commit SHA; Renovate keeps the pin fresh.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@35d8e9a1ce772f67f97e73484dc5b7a50c29e0f3 # v8.1.1
