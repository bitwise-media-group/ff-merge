# This repo's caller for the reusable merge-notice workflow. When a PR is opened it posts
# a one-time comment explaining this repo merges via `/merge` (see merge.yaml).
#
# pull_request_target (not pull_request) so the notice also reaches fork PRs; the reusable
# workflow only posts a static comment with a pull-requests:write token, so the elevated
# context is safe. No secret needed.
#
# Pinned to a full commit SHA; Renovate keeps the pin fresh.
name: Merge Notice

on: # zizmor: ignore[dangerous-triggers] -- required: the notice must reach fork PRs; the reusable workflow only posts a static comment, no PR code is run
  pull_request_target:
    types: [opened]

# the reusable workflow comments with GITHUB_TOKEN; grant just that
permissions:
  pull-requests: write

jobs:
  notice:
    uses: bitwise-media-group/github-workflows/.github/workflows/merge-notice.yaml@2d3b2608662b272b8e5036236e82144507d8bb67 # v7.0.1
    with:
      pr-number: ${{ github.event.pull_request.number }}
