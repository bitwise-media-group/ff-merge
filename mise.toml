#
# ff-merge consumes the shared toolchain (bitwise-media-group/toolchain) as the
# .mise/ submodule: pinned tools come from its config.toml (loaded natively as
# .mise/config.toml), the shared tasks from common/ and the node archetype, and
# the Makefile is a thin forwarder (.mise/archetypes/node/include.mk). The
# biome + rollup + vitest toolchain is exactly what the archetype drives, so
# there are no repo-local tasks. node is pinned here (the repo's own runtime,
# bumped by this repo's Renovate workflow) and locked in mise.lock.

[settings]
lockfile = true

[tools]
node = "24.21.0"

[vars]
# a GitHub Action repo: npm ci runs the lifecycle scripts
npm_ci_flags = ""

[task_config]
includes = [".mise/common/tasks.toml", ".mise/archetypes/node/tasks.toml"]
