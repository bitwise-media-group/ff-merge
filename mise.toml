#
# ff-merge consumes the shared toolchain (bitwise-media-group/toolchain) as the
# .mise/ submodule: mise loads its config.toml natively as .mise/config.toml
# (the pinned tools, bun among them) and this file selects the task files —
# common first, then the node archetype, which drives the package.json
# scripts. The repo is on bun, so it pins no runtime: the toolchain's bun is
# the runtime, package manager, formatter, type checker, bundler and test
# runner.
[task_config]
includes = [".mise/common/tasks.toml", ".mise/archetypes/node/tasks.toml"]
